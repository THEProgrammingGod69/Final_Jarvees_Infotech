<!doctype html>
<html lang="en-IN" class="no-js"{{{htmlAttrs}}}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="robots" content="{{robots}}">
  <link rel="canonical" href="{{canonical}}">
  <meta name="theme-color" content="#f4f0e8">
  <meta name="color-scheme" content="light">
  <meta name="format-detection" content="telephone=no">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Jarvees Infotech">
  <meta property="og:locale" content="en_IN">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{site.url}}/assets/img/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Jarvees Infotech — SAP consulting and Jarvees Academy, Pune">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="{{base}}favicon.svg" type="image/svg+xml">
  <link rel="icon" href="{{base}}assets/img/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="{{base}}assets/img/apple-touch-icon.png">
  <link rel="manifest" href="{{base}}site.webmanifest">

  <link rel="preload" href="{{base}}assets/fonts/newsreader-display-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{base}}assets/fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{@asset assets/css/main.css}}">

  <script>
    /* Before first paint: enable JS-only styles. If main.js never runs, show everything after 2.5 s. */
    (function (h) {
      h.classList.remove('no-js');
      h.classList.add('js');
      setTimeout(function () { if (!window.Jarvees) h.classList.add('no-rv'); }, 2500);
    })(document.documentElement);
  </script>
  <script src="{{@asset assets/js/main.js}}" defer></script>
  {{@pageScripts}}
  <script type="speculationrules">
    {"prefetch": [{"source": "document", "where": {"and": [{"href_matches": "/*"}, {"not": {"selector_matches": "[target=_blank], [download]"}}]}, "eagerness": "moderate"}]}
  </script>
  {{@jsonLd}}
</head>
<body class="{{bodyClass}}" id="top">
  {{> sprite}}
  <a class="skip-link" href="#main">Skip to content</a>

  {{> header}}

  <main id="main" tabindex="-1">
{{{content}}}
  </main>

  {{> footer}}
  {{> overlays}}
</body>
</html>
